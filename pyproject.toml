[project]
name = "unicorn-radar"
version = "2.1.0"
description = "Unicorn Radar — Cala x Slush 2026 Verified Connection Intelligence, Grounded Gemini/Gemma Reasoning, Aiven Persistence & CRACI Build Provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "valkey>=6.0.0",
    "google-genai>=1.0.0",
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-q"

[tool.uv]
package = false
